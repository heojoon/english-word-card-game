<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7ff">
  <title>Wordoria · Crystal Quest 플레이 시안</title>
  <link rel="stylesheet" href="playable-preview.css">
  <script src="native-bridge.js" defer></script>
  <script src="playable-preview.js" defer></script>
</head>
<body>
  <div class="preview-label"><span>CRYSTAL QUEST</span><span>INTERACTIVE PREVIEW</span></div>
  <div class="phone">
    <header class="topbar"><button data-action="home" class="wordmark" aria-label="Wordoria 홈">WORDORIA</button><button class="balance" data-action="wallet" aria-label="크리스털 지갑">◆ <span id="balance">1,250</span></button></header>
    <main id="screen" tabindex="-1"></main>
    <nav id="nav" aria-label="주 메뉴"></nav>
  </div>
  <footer class="preview-footer">더미 플레이 · 변경 사항은 이 브라우저에 저장됩니다 <button data-action="reset">시안 초기화</button></footer>
  <dialog id="dialog"><div id="dialog-content"></div><button class="dialog-close" data-action="close" aria-label="닫기">×</button></dialog>
  <div id="toast" role="status"></div>
</body>
</html>
