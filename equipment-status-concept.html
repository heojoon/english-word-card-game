<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7ff">
  <title>Wordoria · 장비와 상태 컨셉</title>
  <link rel="stylesheet" href="equipment-status-concept.css">
  <script src="equipment-status-concept.js" defer></script>
</head>
<body>
  <div class="concept-label" aria-hidden="true">
    <span>CRYSTAL QUEST · SCREEN CONCEPT 01</span>
    <span>EQUIPMENT &amp; STATUS</span>
  </div>

  <div class="phone-shell">
    <header class="topbar">
      <button class="icon-button" type="button" aria-label="뒤로 가기" data-toast="이전 화면으로 돌아가요">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="topbar-title">
        <span>MY ADVENTURER</span>
        <strong>장비와 상태</strong>
      </div>
      <button class="wallet" type="button" data-toast="보유 크리스털 1,250개">◆ 1,250</button>
    </header>

    <main>
      <section class="hero-card" aria-labelledby="hero-name">
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="hero-heading">
          <span class="level-chip">LV.13</span>
          <p>CRYSTAL GUARDIAN</p>
          <h1 id="hero-name">아이언하트</h1>
          <span>전사 · 흔들리지 않는 수호자</span>
        </div>

        <div class="stat-rail" aria-label="캐릭터 전투 능력치">
          <div><span>HP</span><strong>120</strong><i style="--value:84%"></i></div>
          <div><span>MP</span><strong>48</strong><i style="--value:52%"></i></div>
          <div><span>ATK</span><strong>36</strong><small class="up">+8</small></div>
          <div><span>DEF</span><strong>28</strong><small class="up">+11</small></div>
          <div><span>LUK</span><strong>12</strong><small>+2</small></div>
        </div>

        <div class="character-stage">
          <div class="aura-ring" aria-hidden="true"></div>
          <img src="assets/avatars/warrior.webp?v=20260911-hq" alt="푸른 갑옷과 검을 든 전사 아이언하트">
          <span class="power-chip">전투력 <b>1,284</b></span>
        </div>

        <div class="slot-rail" aria-label="장착 중인 장비">
          <button class="gear-slot rare" type="button" data-slot="head" aria-label="머리 장비, 별빛 왕관 장착 중">
            <span class="slot-icon" data-icon="crown"></span><small>머리</small>
          </button>
          <button class="gear-slot rare" type="button" data-slot="body" aria-label="몸 장비, 수호자의 갑옷 장착 중">
            <span class="slot-icon" data-icon="armor"></span><small>몸</small>
          </button>
          <button class="gear-slot epic" type="button" data-slot="weapon" aria-label="무기 장비, 서리검 장착 중">
            <span class="slot-icon" data-icon="sword"></span><small>무기</small>
          </button>
          <button class="gear-slot empty" type="button" data-slot="back" aria-label="등 장비 비어 있음">
            <span class="plus">＋</span><small>등</small>
          </button>
          <button class="gear-slot empty" type="button" data-slot="aura" aria-label="오라 장비 비어 있음">
            <span class="plus">＋</span><small>오라</small>
          </button>
          <button class="gear-slot empty locked" type="button" data-slot="pet" aria-label="펫 슬롯, 레벨 15에 잠금 해제">
            <span class="lock">◇</span><small>펫</small>
          </button>
        </div>
      </section>

      <section class="growth-card" aria-labelledby="growth-title">
        <div class="growth-copy">
          <span id="growth-title">다음 레벨까지</span>
          <strong>720 <small>/ 1,000 EXP</small></strong>
        </div>
        <div class="xp-track" aria-label="경험치 72퍼센트"><i></i></div>
        <p><span>다음 해금</span><b>LV.15 · 펫 동행 슬롯</b></p>
      </section>

      <section class="inventory" aria-labelledby="inventory-title">
        <div class="section-title">
          <div><span>COLLECTION</span><h2 id="inventory-title">내 장비함 <small>6</small></h2></div>
          <button type="button" data-toast="크리스털 상점으로 이동해요">상점 가기 <b>›</b></button>
        </div>
        <div class="filter-tabs" role="tablist" aria-label="장비 종류">
          <button type="button" role="tab" aria-selected="true" data-filter="all">전체</button>
          <button type="button" role="tab" aria-selected="false" data-filter="weapon">무기</button>
          <button type="button" role="tab" aria-selected="false" data-filter="armor">방어구</button>
          <button type="button" role="tab" aria-selected="false" data-filter="magic">마법</button>
        </div>
        <div class="inventory-grid" id="inventory-grid"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주 메뉴">
      <button type="button" data-toast="홈으로 이동"><span data-nav-icon="home"></span>홈</button>
      <button type="button" aria-current="page"><span data-nav-icon="gear"></span>장비</button>
      <button type="button" data-toast="던전으로 이동"><span data-nav-icon="battle"></span>던전</button>
      <button type="button" data-toast="상점으로 이동"><span data-nav-icon="shop"></span>상점</button>
    </nav>
  </div>

  <dialog id="item-dialog">
    <button class="dialog-close" type="button" data-close aria-label="닫기">×</button>
    <div id="dialog-content"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
