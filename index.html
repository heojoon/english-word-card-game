function posMatch(a,b){return a.pos===b.pos||a.pos.indexOf(b.pos)>=0||b.pos.indexOf(a.pos)>=0}function formScore(a,b){var s=0;if(a.word.charAt(0)===b.word.charAt(0))s+=3;s+=Math.max(0,5-Math.abs(a.word.length-b.word.length));if(a.pos===b.pos)s+=6;else if(posMatch(a,b))s+=4;return s+Math.random()*2}function distractors(q,pool){return pool.filter(function(x){return x.word!==q.word}).sort(function(a,b){return formScore(q,b)-formScore(q,a)}).slice(0,8)}

function records(){try{return JSON.parse(localStorage.getItem('yuliWordQuizScores')||'[]')}catch(e){return[]}}function save(clear){var r=records();r.unshift({player:player,stage:stages[stage].name,correct:correct,total:deck.length,clear:clear,date:new Date().toISOString()});localStorage.setItem('yuliWordQuizScores',JSON.stringify(r.slice(0,100)))}
function finish(clear,answer){window.speechSynthesis&&window.speechSynthesis.cancel();save(clear);el('game').style.display='none';el('result').style.display='block';el('historyCard').classList.remove('hide');el('finalScore').textContent=correct+'/'+deck.length;el('finalScore').classList.toggle('gameover',!clear);el('resultTag').textContent=clear?'STAGE CLEAR':'GAME OVER';el('resultTitle').textContent=clear?'완벽 클리어!':'한 문제 틀려서 종료!';el('resultText').textContent=clear?(player+' · '+stages[stage].name+' 전 문제 정답'):(player+' · '+stages[stage].name+' · '+(idx+1)+'번째 문제에서 종료'+(answer?' · 정답: '+answer:''));renderHistory()}
function renderHistory(){var r=records().filter(function(x){return x.player===player}).slice(0,8),box=el('historyList');box.innerHTML='';if(!r.length){box.innerHTML='<div class="empty">아직 저장된 점수가 없습니다.</div>';return}r.forEach(function(x){var d=document.createElement('div'),date=new Date(x.date);d.className='record';d.innerHTML='<div><b>'+x.player+'</b><br><span class="tiny">'+(x.stage||x.pack||'')+' · '+date.toLocaleString('ko-KR')+' · '+(x.clear?'CLEAR':'GAME OVER')+'</span></div><div class="score">'+x.correct+'/'+x.total+'</div>';box.appendChild(d)})}
el('startBtn').addEventListener('click',start);el('againBtn').addEventListener('click',start);el('homeBtn').addEventListener('click',function(){el('result').style.display='none';el('setup').classList.remove('hide');el('historyCard').classList.remove('hide');renderHistory()});renderHistory();
})();
