<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>율이의 영단어 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e4e7ec;--primary:#4f46e5;--soft:#f4f3ff;--ok:#12b76a;--bad:#f04438}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--primary)}.tiny{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(16,24,40,.05)}.setup,.game,.result{padding:20px}.setup h1{margin:0 0 8px;font-size:25px}.setup p{margin:0 0 20px;color:var(--muted);line-height:1.55}.label{font-size:13px;font-weight:900;margin:18px 0 9px}.players,.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}button{font:inherit;touch-action:manipulation}.pick{position:relative;z-index:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:13px 7px;font-weight:900;cursor:pointer;user-select:none;-webkit-user-select:none}.pick.active{border-color:var(--primary);background:var(--soft);color:var(--primary)}.start{width:100%;margin-top:22px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:17px;font-weight:900;padding:16px;cursor:pointer}.history{margin-top:14px;padding:18px}.history h2{font-size:17px;margin:0 0 10px}.record{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0f1f3}.record:first-child{border-top:0}.score{font-weight:900;color:var(--primary);white-space:nowrap}.empty{font-size:13px;color:var(--muted)}.game,.result{display:none}.gamebar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.progress{height:8px;background:#eef0f4;border-radius:99px;margin:13px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.tag{display:inline-block;background:var(--soft);color:#6941c6;font-size:12px;font-weight:900;border-radius:99px;padding:6px 10px}.question{font-size:30px;line-height:1.3;margin:17px 0 6px;word-break:keep-all}.hint{color:var(--muted);margin:0 0 22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{position:relative;z-index:2;min-height:60px;border:2px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left;font-size:15px;font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none}.choice:active{transform:scale(.99)}.choice.correct{background:#ecfdf3;border-color:var(--ok);color:#067647}.choice.wrong{background:#fef3f2;border-color:var(--bad);color:#b42318}.feedback{min-height:30px;margin-top:14px;font-weight:900}.result{text-align:center}.big{font-size:54px;font-weight:950;color:var(--primary);margin:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef0f4}.hide{display:none!important}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}@media(max-width:560px){.wrap{padding:12px 9px 32px}.setup,.game,.result{padding:16px}.setup h1{font-size:22px}.question{font-size:27px}.choices{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">율이의 <span>영단어 퀴즈</span></div><div class="tiny">Day 11 · Day 12</div></div>
<section id="setup" class="card setup"><h1>플레이어를 고르고 시작하세요</h1><p>영어 → 뜻, 뜻 → 영어 문제가 무작위로 섞여 나옵니다.</p><div class="label">플레이어</div><div class="players"><button type="button" class="pick active" data-player="율이">율이</button><button type="button" class="pick" data-player="아빠">아빠</button><button type="button" class="pick" data-player="손님">손님</button></div><div class="label">문제 범위</div><div class="packs"><button type="button" class="pick active" data-pack="all">전체<br><span class="tiny">60문제</span></button><button type="button" class="pick" data-pack="d11">Day 11<br><span class="tiny">30문제</span></button><button type="button" class="pick" data-pack="d12">Day 12<br><span class="tiny">30문제</span></button></div><button type="button" class="start" id="startBtn">게임 시작</button></section>
<section id="game" class="card game"><div class="gamebar"><span><b id="who"></b> · <span id="packName"></span></span><span>점수 <b id="liveScore"></b></span></div><div class="progress"><i id="progress"></i></div><span class="tag" id="direction"></span><h2 class="question" id="question"></h2><p class="hint" id="hint"></p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></section>
<section id="result" class="card result"><span class="tag">게임 완료</span><div class="big" id="finalScore"></div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button type="button" class="btn primary" id="againBtn">다시 하기</button><button type="button" class="btn secondary" id="homeBtn">플레이어 선택</button></div></section>
<section id="historyCard" class="card history"><h2>최근 점수 기록 <span class="tiny">· 이 기기에 저장</span></h2><div id="historyList"></div></section><div class="footer">점수는 브라우저에 저장됩니다.</div>
</div>
<script>
(function(){
'use strict';
var day11=[['declare','선언하다, 표명하다'],['blackboard','칠판'],['refuse','거절하다'],['tap','(가볍게) 톡톡 두드리다'],['maximum','최고의, 최대의'],['minimum','최저의, 최소한의'],['actually','실제로, 실은'],['classmate','반 친구'],['signal','신호; 신호를 보내다'],['highlight','강조하다; 가장 흥미로운 부분'],['sincere','진실된, 진심 어린'],['bet','내기하다; 내기'],['chore','허드렛일, 하기 싫은 일'],['chilly','쌀쌀한, 추운'],['concentrate','집중하다'],['satellite','인공위성'],['shuttle','정기 왕복 항공기(버스, 열차)'],['delay','지연, 지체; 미루다, 연기하다'],['solution','해결책, 해법'],['fully','완전히, 충분히'],['department','부서, 학과'],['generous','인심 좋은, 관대한'],['population','인구'],['frame','뼈대, 틀, 액자'],['lyrics','(노래의) 가사, 서정시'],['industry','산업, 업계'],['opposite','건너편에; 반대의'],['understanding','이해, 이해력'],['dizzy','어지러운, 아찔한'],['even though','비록 ~일지라도']];
var day12=[['journey','여행'],['shelter','피난처'],['hurricane','허리케인'],['ruler','통치자, 지배자'],['tax','세금'],['fingerprint','지문'],['slip','미끄러지다'],['budget','예산'],['electricity','전기'],['insult','모욕; 모욕하다'],['summarize','요약하다'],['scrape','긁어내다, 벗겨내다'],['reveal','드러내다, 밝히다'],['below','아래에; ~아래에'],['brick','벽돌'],['space','우주'],['passion','열정'],['as long as','~하는 한'],['national','국가의, 전국적인'],['display','전시하다; 전시'],['billion','10억'],['perspective','관점, 시각'],['optical','시각적인'],['rush','서두르다'],['trait','특성'],['compass','나침반'],['pole','막대기, (지구의) 극'],['rely on','~에 의존하다, ~에 의지하다'],['lid','뚜껑'],['impossible','불가능한, 믿기 어려운']];
var packs={all:{name:'전체',words:day11.concat(day12)},d11:{name:'Day 11',words:day11},d12:{name:'Day 12',words:day12}};
var player='율이',pack='all',deck=[],idx=0,correct=0,locked=false;
function el(id){return document.getElementById(id)}
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=x[i];x[i]=x[j];x[j]=t}return x}
function selectButtons(attr,value){var bs=document.querySelectorAll('['+attr+']');for(var i=0;i<bs.length;i++){bs[i].classList.toggle('active',bs[i].getAttribute(attr)===value)}}
var pbs=document.querySelectorAll('[data-player]');for(var i=0;i<pbs.length;i++){pbs[i].addEventListener('click',function(e){e.preventDefault();player=this.getAttribute('data-player');selectButtons('data-player',player);renderHistory()},{passive:false})}
var kbs=document.querySelectorAll('[data-pack]');for(var j=0;j<kbs.length;j++){kbs[j].addEventListener('click',function(e){e.preventDefault();pack=this.getAttribute('data-pack');selectButtons('data-pack',pack)},{passive:false})}
function start(){var words=packs[pack].words;deck=shuffle(words).map(function(w){return{word:w[0],meaning:w[1],mode:Math.random()<0.5?'en-ko':'ko-en'}});idx=0;correct=0;locked=false;el('setup').classList.add('hide');el('result').style.display='none';el('game').style.display='block';el('historyCard').classList.add('hide');renderQuestion()}
function renderQuestion(){if(idx>=deck.length){finish();return}locked=false;var q=deck[idx],enko=q.mode==='en-ko',answer=enko?q.meaning:q.word,pool=packs[pack].words,wrong=[];for(var i=0;i<pool.length;i++){if(pool[i][0]!==q.word)wrong.push(enko?pool[i][1]:pool[i][0])}var opts=shuffle([answer].concat(shuffle(wrong).slice(0,3)));el('who').textContent=player;el('packName').textContent=packs[pack].name;el('liveScore').textContent=correct+'/'+deck.length;el('progress').style.width=(idx/deck.length*100)+'%';el('direction').textContent=enko?'영어 → 뜻':'뜻 → 영어';el('question').textContent=enko?q.word:q.meaning;el('hint').textContent=enko?'알맞은 뜻을 고르세요.':'알맞은 영어 단어를 고르세요.';el('feedback').textContent='';var box=el('choices');box.innerHTML='';for(var n=0;n<opts.length;n++){(function(option){var b=document.createElement('button');b.type='button';b.className='choice';b.textContent=option;b.addEventListener('click',function(e){e.preventDefault();choose(this,option,answer)},{passive:false});box.appendChild(b)})(opts[n])}}
function choose(button,chosen,answer){if(locked)return;locked=true;var ok=chosen===answer;if(ok)correct++;var bs=el('choices').querySelectorAll('button');for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(bs[i].textContent===answer)bs[i].classList.add('correct')}if(!ok)button.classList.add('wrong');el('liveScore').textContent=correct+'/'+deck.length;el('feedback').textContent=ok?'정답!':'오답 — 정답을 확인하세요.';setTimeout(function(){idx++;renderQuestion()},800)}
function records(){try{return JSON.parse(localStorage.getItem('yuliWordQuizScores')||'[]')}catch(e){return[]}}
function save(){var r=records();r.unshift({player:player,pack:packs[pack].name,correct:correct,total:deck.length,date:new Date().toISOString()});localStorage.setItem('yuliWordQuizScores',JSON.stringify(r.slice(0,100)))}
function finish(){save();el('game').style.display='none';el('result').style.display='block';el('historyCard').classList.remove('hide');el('finalScore').textContent=correct+'/'+deck.length;var rate=Math.round(correct/deck.length*100);el('resultTitle').textContent=rate>=90?'대단해요!':rate>=70?'잘했어요!':'한 번 더 도전해 봐요!';el('resultText').textContent=player+' · '+packs[pack].name+' · 정답률 '+rate+'%';renderHistory()}
function renderHistory(){var r=records().filter(function(x){return x.player===player}).slice(0,8),box=el('historyList');box.innerHTML='';if(!r.length){box.innerHTML='<div class="empty">아직 저장된 점수가 없습니다.</div>';return}for(var i=0;i<r.length;i++){var d=document.createElement('div');d.className='record';var date=new Date(r[i].date);d.innerHTML='<div><b>'+r[i].player+'</b><br><span class="tiny">'+r[i].pack+' · '+date.toLocaleString('ko-KR')+'</span></div><div class="score">'+r[i].correct+'/'+r[i].total+'</div>';box.appendChild(d)}}
el('startBtn').addEventListener('click',start);el('againBtn').addEventListener('click',start);el('homeBtn').addEventListener('click',function(){el('result').style.display='none';el('setup').classList.remove('hide');el('historyCard').classList.remove('hide');renderHistory()});renderHistory();
})();
</script>
</body></html>
