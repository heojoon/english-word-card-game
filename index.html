<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>율이의 영단어 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e4e7ec;--primary:#4f46e5;--soft:#f4f3ff;--ok:#12b76a;--bad:#f04438;--warn:#f79009}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 12px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-size:22px;font-weight:900}.brand span{color:var(--primary)}.tiny{font-size:12px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 28px rgba(16,24,40,.05)}.setup,.game,.result{padding:20px}.setup h1{margin:0 0 8px;font-size:25px}.setup p{margin:0 0 20px;color:var(--muted);line-height:1.55}.danger{background:#fff4ed;border:1px solid #ffd6ae;color:#b54708;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:800;line-height:1.45;margin:14px 0}.label{font-size:13px;font-weight:900;margin:18px 0 9px}.players,.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stages{grid-template-columns:1fr 1fr}button{font:inherit;touch-action:manipulation}.pick{position:relative;z-index:1;border:2px solid var(--line);background:#fff;border-radius:13px;padding:13px 7px;font-weight:900;cursor:pointer;user-select:none;-webkit-user-select:none}.pick.active{border-color:var(--primary);background:var(--soft);color:var(--primary)}.start{width:100%;margin-top:22px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:17px;font-weight:900;padding:16px;cursor:pointer}.history{margin-top:14px;padding:18px}.history h2{font-size:17px;margin:0 0 10px}.record{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #f0f1f3}.record:first-child{border-top:0}.score{font-weight:900;color:var(--primary);white-space:nowrap}.empty{font-size:13px;color:var(--muted)}.game,.result{display:none}.gamebar{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.progress{height:8px;background:#eef0f4;border-radius:99px;margin:13px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.tag{display:inline-block;background:var(--soft);color:#6941c6;font-size:12px;font-weight:900;border-radius:99px;padding:6px 10px}.question{font-size:30px;line-height:1.3;margin:17px 0 6px;word-break:keep-all}.hint{color:var(--muted);margin:0 0 22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{position:relative;z-index:2;min-height:64px;border:2px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left;font-size:15px;font-weight:800;cursor:pointer;user-select:none;-webkit-user-select:none;line-height:1.4}.choice:active{transform:scale(.99)}.choice.correct{background:#ecfdf3;border-color:var(--ok);color:#067647}.choice.wrong{background:#fef3f2;border-color:var(--bad);color:#b42318}.feedback{min-height:30px;margin-top:14px;font-weight:900}.result{text-align:center}.big{font-size:54px;font-weight:950;color:var(--primary);margin:12px}.gameover{color:var(--bad)!important}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.btn{border:0;border-radius:13px;padding:14px;font-weight:900;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:#eef0f4}.hide{display:none!important}.footer{text-align:center;font-size:11px;color:var(--muted);margin-top:16px}@media(max-width:560px){.wrap{padding:12px 9px 32px}.setup,.game,.result{padding:16px}.setup h1{font-size:22px}.question{font-size:27px}.choices{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand">율이의 <span>영단어 퀴즈</span></div><div class="tiny">Stage 1 · Stage 2</div></div>
<section id="setup" class="card setup">
<h1>플레이어와 스테이지를 고르세요</h1>
<p>영어 → 뜻, 뜻 → 영어 문제가 무작위로 섞여 나옵니다. 오답 보기는 같은 품사 중심으로 출제됩니다.</p>
<div class="danger">⚠️ 서바이벌 규칙: 한 문제라도 틀리면 즉시 GAME OVER!</div>
<div class="label">플레이어</div>
<div class="players"><button type="button" class="pick active" data-player="율이">율이</button><button type="button" class="pick" data-player="아빠">아빠</button><button type="button" class="pick" data-player="손님">손님</button></div>
<div class="label">스테이지</div>
<div class="stages"><button type="button" class="pick active" data-stage="s1">Stage 1<br><span class="tiny">Day 11·12 · 60문제</span></button><button type="button" class="pick" data-stage="s2">Stage 2<br><span class="tiny">새 단어 · 50문제</span></button></div>
<button type="button" class="start" id="startBtn">게임 시작</button>
</section>
<section id="game" class="card game"><div class="gamebar"><span><b id="who"></b> · <span id="stageName"></span></span><span>점수 <b id="liveScore"></b></span></div><div class="progress"><i id="progress"></i></div><span class="tag" id="direction"></span><h2 class="question" id="question"></h2><p class="hint" id="hint"></p><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></section>
<section id="result" class="card result"><span class="tag" id="resultTag">게임 완료</span><div class="big" id="finalScore"></div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="actions"><button type="button" class="btn primary" id="againBtn">다시 도전</button><button type="button" class="btn secondary" id="homeBtn">스테이지 선택</button></div></section>
<section id="historyCard" class="card history"><h2>최근 점수 기록 <span class="tiny">· 이 기기에 저장</span></h2><div id="historyList"></div></section><div class="footer">점수는 브라우저에 저장됩니다.</div>
</div>
<script>
(function(){
'use strict';
function W(word,pos,meaning){return{word:word,pos:pos,meaning:meaning}}
var stage1=[
W('declare','동','선언하다, 표명하다'),W('blackboard','명','칠판'),W('refuse','동','거절하다'),W('tap','동','(가볍게) 톡톡 두드리다'),W('maximum','형','최고의, 최대의'),W('minimum','형','최저의, 최소한의'),W('actually','부','실제로, 실은'),W('classmate','명','반 친구'),W('signal','명/동','신호; 신호를 보내다'),W('highlight','동/명','강조하다; 가장 흥미로운 부분'),W('sincere','형','진실된, 진심 어린'),W('bet','동/명','내기하다; 내기'),W('chore','명','허드렛일, 하기 싫은 일'),W('chilly','형','쌀쌀한, 추운'),W('concentrate','동','집중하다'),W('satellite','명','인공위성'),W('shuttle','명','정기 왕복 항공기(버스, 열차)'),W('delay','명/동','지연, 지체; 미루다, 연기하다'),W('solution','명','해결책, 해법'),W('fully','부','완전히, 충분히'),W('department','명','부서, 학과'),W('generous','형','인심 좋은, 관대한'),W('population','명','인구'),W('frame','명','뼈대, 틀, 액자'),W('lyrics','명','(노래의) 가사, 서정시'),W('industry','명','산업, 업계'),W('opposite','형/명','반대의; 반대편'),W('understanding','명','이해, 이해력'),W('dizzy','형','어지러운, 아찔한'),W('even though','접','비록 ~일지라도'),
W('journey','명','여행'),W('shelter','명','피난처'),W('hurricane','명','허리케인'),W('ruler','명','통치자, 지배자'),W('tax','명','세금'),W('fingerprint','명','지문'),W('slip','동','미끄러지다'),W('budget','명','예산'),W('electricity','명','전기'),W('insult','명/동','모욕; 모욕하다'),W('summarize','동','요약하다'),W('scrape','동','긁어내다, 벗겨내다'),W('reveal','동','드러내다, 밝히다'),W('below','전/부','아래에, ~아래에'),W('brick','명','벽돌'),W('space','명','우주'),W('passion','명','열정'),W('as long as','접','~하는 한'),W('national','형','국가의, 전국적인'),W('display','동/명','전시하다; 전시'),W('billion','명','10억'),W('perspective','명','관점, 시각'),W('optical','형','시각적인'),W('rush','동','서두르다'),W('trait','명','특성'),W('compass','명','나침반'),W('pole','명','막대기, (지구의) 극'),W('rely on','숙어','~에 의존하다, ~에 의지하다'),W('lid','명','뚜껑'),W('impossible','형','불가능한, 믿기 어려운')
];
var stage2=[
W('liquid','명/형','액체; 액체의'),W('campaign','명','(사회적) 운동, 캠페인'),W('make-up','명','화장품, 화장'),W('draw','동','끌어당기다, 잡아당기다'),W('conduct','동','(특정 행동을) 하다, 실시하다'),W('impression','명','인상, 느낌'),W('exhibit','동','전시하다'),W('starve','동','굶주리다, 굶어 죽다'),W('post','명/동','우편; 우편물을 발송하다'),W('notice','명/동','주의, 공고; 알아차리다, 인지하다'),W('erupt','동','폭발하다, 터지다'),W('stay up','숙어','안 자다, 깨어 있다'),W('remain','동','여전히 ~이다, 남다'),W('press','동','누르다, 바짝 대다'),W('intellectual','형','지능의, 지적인'),
W('talented','형','재능 있는'),W('occur','동','발생하다, 일어나다'),W('experiment','명/동','실험; 실험하다'),W('hatch','동','부화하다'),W('code','명','암호, 부호'),W('durable','형','견고한, 오래가는'),W('rent','명/동','집세, 방세; 세를 내다, 빌리다'),W('grassland','명','풀밭, 초원'),W('expense','명','비용, 돈'),W('connection','명','연결, 관련성'),W('achieve','동','성취하다, 달성하다'),W('metal','명','금속'),W('adviser','명','조언자, 상담가'),W('harm','명/동','손해, 피해; 해를 끼치다'),W('log','명','통나무'),
W('sculpture','명','조각, 조각품'),W('title','동','제목을 붙이다'),W('accidentally','부','우연히, 실수로'),W('visitor','명','방문객, 손님'),W('be made of','숙어','~로 만들어지다'),W('real','형','진짜의, 실제의'),W('balloon','명','풍선'),W('inspire','동','영감을 주다'),W('everyday','형','일상적인, 매일의'),W('such as','숙어','~와 같은'),W('vacuum cleaner','명','진공청소기'),W('modern','형','현대의, 현대적인'),W('bring A together','숙어','A를 결합시키다'),W('stainless steel','명','스테인리스(강철)'),W('stand','동','서다, 서 있다'),W('shiny','형','반짝이는, 빛나는'),W('surface','명','표면'),W('reflection','명','(거울 등에 비친) 모습'),W('work','명','작품'),W('value','명','가치'),W('piece','명','(작품) 한 점; 작품')
];
var stages={s1:{name:'Stage 1',words:stage1},s2:{name:'Stage 2',words:stage2}};
var player='율이',stage='s1',deck=[],idx=0,correct=0,locked=false;
function el(id){return document.getElementById(id)}
function shuffle(a){var x=a.slice();for(var i=x.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=x[i];x[i]=x[j];x[j]=t}return x}
function selectButtons(attr,value){var bs=document.querySelectorAll('['+attr+']');for(var i=0;i<bs.length;i++)bs[i].classList.toggle('active',bs[i].getAttribute(attr)===value)}
function posLabel(w){return '['+w.pos+'] '+w.meaning}
function samePos(a,b){return a.pos===b.pos || a.pos.indexOf(b.pos)>=0 || b.pos.indexOf(a.pos)>=0}
function distractors(q,enko,pool){var same=[],other=[];for(var i=0;i<pool.length;i++){var w=pool[i];if(w.word===q.word)continue;(samePos(q,w)?same:other).push(w)}same=shuffle(same);other=shuffle(other);var picked=same.slice(0,3);while(picked.length<3&&other.length)picked.push(other.shift());return picked.map(function(w){return enko?posLabel(w):w.word})}
var pbs=document.querySelectorAll('[data-player]');for(var i=0;i<pbs.length;i++)pbs[i].addEventListener('click',function(e){e.preventDefault();player=this.getAttribute('data-player');selectButtons('data-player',player);renderHistory()},{passive:false});
var sbs=document.querySelectorAll('[data-stage]');for(var j=0;j<sbs.length;j++)sbs[j].addEventListener('click',function(e){e.preventDefault();stage=this.getAttribute('data-stage');selectButtons('data-stage',stage)},{passive:false});
function start(){var words=stages[stage].words;deck=shuffle(words).map(function(w){return{word:w.word,pos:w.pos,meaning:w.meaning,mode:Math.random()<0.5?'en-ko':'ko-en'}});idx=0;correct=0;locked=false;el('setup').classList.add('hide');el('result').style.display='none';el('game').style.display='block';el('historyCard').classList.add('hide');renderQuestion()}
function renderQuestion(){if(idx>=deck.length){finish(false);return}locked=false;var q=deck[idx],enko=q.mode==='en-ko',pool=stages[stage].words,answer=enko?'['+q.pos+'] '+q.meaning:q.word,opts=shuffle([answer].concat(distractors(q,enko,pool)));el('who').textContent=player;el('stageName').textContent=stages[stage].name;el('liveScore').textContent=correct+'/'+deck.length;el('progress').style.width=(idx/deck.length*100)+'%';el('direction').textContent=enko?'영어 → 뜻':'뜻 → 영어';el('question').textContent=enko?q.word:'['+q.pos+'] '+q.meaning;el('hint').textContent=enko?'품사까지 보고 가장 알맞은 뜻을 고르세요.':'알맞은 영어 단어를 고르세요.';el('feedback').textContent='';var box=el('choices');box.innerHTML='';for(var n=0;n<opts.length;n++){(function(option){var b=document.createElement('button');b.type='button';b.className='choice';b.textContent=option;b.addEventListener('click',function(e){e.preventDefault();choose(this,option,answer)},{passive:false});box.appendChild(b)})(opts[n])}}
function choose(button,chosen,answer){if(locked)return;locked=true;var ok=chosen===answer;var bs=el('choices').querySelectorAll('button');for(var i=0;i<bs.length;i++){bs[i].disabled=true;if(bs[i].textContent===answer)bs[i].classList.add('correct')}if(ok){correct++;el('liveScore').textContent=correct+'/'+deck.length;el('feedback').textContent='정답!';setTimeout(function(){idx++;renderQuestion()},550)}else{button.classList.add('wrong');el('feedback').textContent='오답! GAME OVER';setTimeout(function(){finish(true,answer)},850)}}
function records(){try{return JSON.parse(localStorage.getItem('yuliWordQuizScoresV2')||'[]')}catch(e){return[]}}
function save(gameOver){var r=records();r.unshift({player:player,stage:stages[stage].name,correct:correct,total:deck.length,gameOver:gameOver,date:new Date().toISOString()});localStorage.setItem('yuliWordQuizScoresV2',JSON.stringify(r.slice(0,100)))}
function finish(gameOver,answer){save(!!gameOver);el('game').style.display='none';el('result').style.display='block';el('historyCard').classList.remove('hide');el('finalScore').textContent=correct+'/'+deck.length;el('finalScore').classList.toggle('gameover',!!gameOver);el('resultTag').textContent=gameOver?'GAME OVER':'STAGE CLEAR';if(gameOver){el('resultTitle').textContent='한 문제를 틀렸습니다';el('resultText').textContent='정답: '+answer+' · '+(idx+1)+'번째 문제에서 종료되었습니다.'}else{el('resultTitle').textContent='완벽합니다!';el('resultText').textContent=player+' · '+stages[stage].name+' 전 문제 정답!'}renderHistory()}
function renderHistory(){var r=records().filter(function(x){return x.player===player}).slice(0,8),box=el('historyList');box.innerHTML='';if(!r.length){box.innerHTML='<div class="empty">아직 저장된 점수가 없습니다.</div>';return}for(var i=0;i<r.length;i++){var d=document.createElement('div');d.className='record';var date=new Date(r[i].date);d.innerHTML='<div><b>'+r[i].player+'</b><br><span class="tiny">'+r[i].stage+' · '+(r[i].gameOver?'GAME OVER':'CLEAR')+' · '+date.toLocaleString('ko-KR')+'</span></div><div class="score">'+r[i].correct+'/'+r[i].total+'</div>';box.appendChild(d)}}
el('startBtn').addEventListener('click',start);el('againBtn').addEventListener('click',start);el('homeBtn').addEventListener('click',function(){el('result').style.display='none';el('setup').classList.remove('hide');el('historyCard').classList.remove('hide');renderHistory()});renderHistory();
})();
</script>
</body></html>
