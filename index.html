<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>율이의 영단어 퀴즈</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#182230;--muted:#667085;--line:#e4e7ec;--primary:#4f46e5;--primary2:#7c3aed;--ok:#12b76a;--bad:#f04438;--soft:#f4f3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}.wrap{max-width:760px;margin:0 auto;padding:20px 14px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px}.brand span{color:var(--primary)}.tiny{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 28px rgba(16,24,40,.05)}.setup{padding:22px}.setup h1{font-size:26px;line-height:1.25;margin:0 0 8px}.setup p{margin:0 0 22px;color:var(--muted);line-height:1.55}.label{font-size:13px;font-weight:800;margin:18px 0 9px}.players,.packs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.pick{border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px 8px;font-weight:800;cursor:pointer}.pick.active{border-color:var(--primary);background:var(--soft);color:var(--primary)}.start{width:100%;margin-top:22px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;font-size:17px;font-weight:900;padding:15px;cursor:pointer}.history{margin-top:14px;padding:18px 20px}.history-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.history h2{font-size:17px;margin:0}.history-list{display:grid;gap:8px}.record{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid #f0f1f3}.record:first-child{border-top:0}.score{font-weight:900;color:var(--primary)}.empty{color:var(--muted);font-size:13px}.game{display:none;padding:20px}.gamebar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}.gamebar b{color:var(--ink)}.progress{height:8px;background:#eef0f4;border-radius:99px;margin:13px 0 30px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:.2s}.tag{display:inline-block;background:var(--soft);color:#6941c6;font-size:12px;font-weight:900;border-radius:99px;padding:6px 10px}.question{font-size:31px;line-height:1.3;letter-spacing:-1px;margin:18px 0 6px;word-break:keep-all}.hint{color:var(--muted);margin:0 0 24px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:58px;border:1px solid var(--line);background:#fff;border-radius:13px;padding:13px;text-align:left;font-size:15px;font-weight:800;cursor:pointer}.choice:hover{border-color:#a7a3ff}.choice.correct{background:#ecfdf3;border-color:var(--ok);color:#067647}.choice.wrong{background:#fef3f2;border-color:var(--bad);color:#b42318}.choice:disabled{cursor:default}.feedback{min-height:28px;margin-top:15px;font-weight:900}.result{display:none;text-align:center;padding:32px 20px}.result .big{font-size:56px;font-weight:950;color:var(--primary);letter-spacing:-2px;margin:12px 0}.result p{color:var(--muted);line-height:1.6}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px}.btn{border:0;border-radius:13px;padding:13px;font-weight:900;cursor:pointer}.btn.primary{background:var(--primary);color:white}.btn.secondary{background:#eef0f4;color:var(--ink)}.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}.hide{display:none!important}@media(max-width:560px){.wrap{padding:14px 10px 35px}.setup,.game{padding:17px}.setup h1{font-size:23px}.players,.packs{grid-template-columns:1fr 1fr 1fr}.question{font-size:27px}.choices{grid-template-columns:1fr}.result-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">율이의 <span>영단어 퀴즈</span></div><div class="tiny">Day 11 · Day 12</div></div>

  <section id="setup" class="card setup">
    <h1>플레이어를 고르고 시작하세요</h1>
    <p>영어 → 뜻, 뜻 → 영어 문제가 무작위로 섞여 나옵니다. 모든 문제는 4지선다입니다.</p>
    <div class="label">플레이어</div>
    <div class="players" id="players"></div>
    <div class="label">문제 범위</div>
    <div class="packs" id="packs"></div>
    <button class="start" id="startBtn">게임 시작</button>
  </section>

  <section id="game" class="card game">
    <div class="gamebar"><span><b id="who"></b> · <span id="packName"></span></span><span>점수 <b id="liveScore">0/0</b></span></div>
    <div class="progress"><i id="progress"></i></div>
    <span class="tag" id="direction"></span>
    <h2 class="question" id="question"></h2>
    <p class="hint" id="hint"></p>
    <div class="choices" id="choices"></div>
    <div class="feedback" id="feedback"></div>
  </section>

  <section id="result" class="card result">
    <span class="tag">게임 완료</span>
    <div class="big" id="finalScore"></div>
    <h2 id="resultTitle"></h2>
    <p id="resultText"></p>
    <div class="result-actions"><button class="btn primary" id="againBtn">다시 하기</button><button class="btn secondary" id="homeBtn">플레이어 선택</button></div>
  </section>

  <section class="card history" id="historyCard">
    <div class="history-head"><h2>최근 점수 기록</h2><span class="tiny">이 기기에 저장</span></div>
    <div class="history-list" id="historyList"></div>
  </section>
  <div class="footer-note">점수 기록은 브라우저의 로컬 저장소에 저장됩니다.</div>
</div>
<script>
const day11=[
['declare','선언하다, 표명하다'],['blackboard','칠판'],['refuse','거절하다'],['tap','(가볍게) 톡톡 두드리다'],['maximum','최고의, 최대의'],['minimum','최저의, 최소한의'],['actually','실제로, 실은'],['classmate','반 친구'],['signal','신호; 신호를 보내다'],['highlight','강조하다; 가장 흥미로운 부분'],['sincere','진실된, 진심 어린'],['bet','내기하다; 내기'],['chore','허드렛일, 하기 싫은 일'],['chilly','쌀쌀한, 추운'],['concentrate','집중하다'],['satellite','인공위성'],['shuttle','정기 왕복 항공기(버스, 열차)'],['delay','지연, 지체; 미루다, 연기하다'],['solution','해결책, 해법'],['fully','완전히, 충분히'],['department','부서, 학과'],['generous','인심 좋은, 관대한'],['population','인구'],['frame','뼈대, 틀, 액자'],['lyrics','(노래의) 가사, 서정시'],['industry','산업, 업계'],['opposite','건너편에; 반대의'],['understanding','이해, 이해력'],['dizzy','어지러운, 아찔한'],['even though','비록 ~일지라도']
];
const day12=[
['journey','여행'],['shelter','피난처'],['hurricane','허리케인'],['ruler','통치자, 지배자'],['tax','세금'],['fingerprint','지문'],['slip','미끄러지다'],['budget','예산'],['electricity','전기'],['insult','모욕; 모욕하다'],['summarize','요약하다'],['scrape','긁어내다, 벗겨내다'],['reveal','드러내다, 밝히다'],['below','아래에; ~아래에'],['brick','벽돌'],['space','우주'],['passion','열정'],['as long as','~하는 한'],['national','국가의, 전국적인'],['display','전시하다; 전시'],['billion','10억'],['perspective','관점, 시각'],['optical','시각적인'],['rush','서두르다'],['trait','특성'],['compass','나침반'],['pole','막대기, (지구의) 극'],['rely on','~에 의존하다, ~에 의지하다'],['lid','뚜껑'],['impossible','불가능한, 믿기 어려운']
];
const players=['율이','아빠','손님'];
const packDefs=[{id:'all',name:'전체',words:[...day11,...day12]},{id:'d11',name:'Day 11',words:day11},{id:'d12',name:'Day 12',words:day12}];
let selectedPlayer='율이', selectedPack='all', deck=[], idx=0, correct=0, locked=false;
const $=s=>document.querySelector(s); const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function renderSetup(){
  $('#players').innerHTML=players.map(p=>`<button class="pick ${p===selectedPlayer?'active':''}" data-player="${p}">${p}</button>`).join('');
  $('#packs').innerHTML=packDefs.map(p=>`<button class="pick ${p.id===selectedPack?'active':''}" data-pack="${p.id}">${p.name}<br><span class="tiny">${p.words.length}문제</span></button>`).join('');
  document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>{selectedPlayer=b.dataset.player;renderSetup();renderHistory()});
  document.querySelectorAll('[data-pack]').forEach(b=>b.onclick=()=>{selectedPack=b.dataset.pack;renderSetup()});
}
function currentPack(){return packDefs.find(p=>p.id===selectedPack)}
function startGame(){deck=shuffle(currentPack().words).map(w=>({word:w[0],meaning:w[1],mode:Math.random()<.5?'en-ko':'ko-en'}));idx=0;correct=0;locked=false;$('#setup').classList.add('hide');$('#result').style.display='none';$('#game').style.display='block';$('#historyCard').classList.add('hide');renderQuestion()}
function renderQuestion(){if(idx>=deck.length)return finish();locked=false;const q=deck[idx], pool=currentPack().words;const enToKo=q.mode==='en-ko';const answer=enToKo?q.meaning:q.word;const wrongPool=pool.filter(w=>w[0]!==q.word).map(w=>enToKo?w[1]:w[0]);const options=shuffle([answer,...shuffle(wrongPool).slice(0,3)]);$('#who').textContent=selectedPlayer;$('#packName').textContent=currentPack().name;$('#liveScore').textContent=`${correct}/${deck.length}`;$('#progress').style.width=`${idx/deck.length*100}%`;$('#direction').textContent=enToKo?'영어 → 뜻':'뜻 → 영어';$('#question').textContent=enToKo?q.word:q.meaning;$('#hint').textContent=enToKo?'알맞은 뜻을 고르세요.':'알맞은 영어 단어를 고르세요.';$('#feedback').textContent='';$('#choices').innerHTML=options.map(o=>`<button class="choice" data-answer="${esc(o)}">${esc(o)}</button>`).join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>answer(b,answer))}
function answer(button,answerText){if(locked)return;locked=true;const ok=button.dataset.answer===answerText;if(ok)correct++;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===answerText)b.classList.add('correct')});if(!ok)button.classList.add('wrong');$('#liveScore').textContent=`${correct}/${deck.length}`;$('#feedback').textContent=ok?'정답!':'오답 — 정답을 확인하세요.';setTimeout(()=>{idx++;renderQuestion()},720)}
function getRecords(){try{return JSON.parse(localStorage.getItem('yuliWordQuizScores')||'[]')}catch(e){return[]}}
function saveRecord(){const records=getRecords();records.unshift({player:selectedPlayer,pack:currentPack().name,correct,total:deck.length,date:new Date().toISOString()});localStorage.setItem('yuliWordQuizScores',JSON.stringify(records.slice(0,100)))}
function finish(){saveRecord();$('#game').style.display='none';$('#result').style.display='block';$('#historyCard').classList.remove('hide');$('#finalScore').textContent=`${correct}/${deck.length}`;const rate=Math.round(correct/deck.length*100);$('#resultTitle').textContent=rate>=90?'대단해요!':rate>=70?'잘했어요!':'한 번 더 도전해 봐요!';$('#resultText').textContent=`${selectedPlayer} · ${currentPack().name} · 정답률 ${rate}%`;renderHistory()}
function renderHistory(){const records=getRecords().filter(r=>r.player===selectedPlayer).slice(0,8);$('#historyList').innerHTML=records.length?records.map(r=>{const d=new Date(r.date);return `<div class="record"><div><b>${r.player}</b> <span class="tiny">${r.pack} · ${d.toLocaleDateString('ko-KR')} ${d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="score">${r.correct}/${r.total}</div></div>`}).join(''):'<div class="empty">아직 저장된 점수가 없습니다.</div>'}
$('#startBtn').onclick=startGame;$('#againBtn').onclick=startGame;$('#homeBtn').onclick=()=>{$('#result').style.display='none';$('#setup').classList.remove('hide');$('#historyCard').classList.remove('hide');renderSetup();renderHistory()};renderSetup();renderHistory();
</script>
</body>
</html>
