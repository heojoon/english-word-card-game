<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검은뿌리 거목 SD 검수</title>
<style>
body{font-family:system-ui,sans-serif;background:#f7f7ff;color:#24214c;margin:24px auto;padding:0 16px;max-width:720px}h1{font-size:24px}button,select{font:inherit;padding:10px;border:1px solid #cac8eb;border-radius:12px;background:white;color:#24214c}nav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}canvas{display:block;margin:auto;max-width:100%;height:auto;border-radius:20px;background:#5751d8}p{line-height:1.6}img{max-width:100%}label{display:inline-flex;align-items:center;gap:8px}button[aria-pressed=true]{background:#5751d8;color:white}
</style>
<h1>검은뿌리 거목 · 월드 8 중간보스</h1>
<p>기존 스탠딩 CG 기반 SD 제작물 · 월드 8의 15단계 적용 · 사용자 시각 승인 전</p>
<nav id="actions"></nav>
<nav><button id="play">재생</button><label>프레임 <select id="frame"><option value="0">1</option><option value="1">2</option><option value="2">3</option></select></label><label>배경 <select id="background"><option value="#5751d8">Crystal Violet</option><option value="#f7f7ff">밝은 배경</option></select></label></nav>
<canvas width="448" height="384" aria-label="SD 동작 프리뷰"></canvas>
<p id="status" aria-live="polite"></p>
<p>피격의 마지막 완전 다운 자세는 유지됩니다. 일반 피격에 적용할 때는 2프레임까지만 사용합니다.</p>
<details><summary>128px 전체 프레임 검수</summary><img src="review/mobile-frame-grid.png" alt="5종 동작의 밝은 배경과 보라색 배경 검수"></details>
<script>
const names={idle:'대기',attack:'가지 내려찍기',hit:'피격·다운',roots:'뿌리 솟구치기',guard:'나무껍질 방어'};
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),select=document.querySelector('#frame'),status=document.querySelector('#status');
let meta,img,action='idle',frame=0,playing=false,timer,request=0;
function stop(){playing=false;clearTimeout(timer);document.querySelector('#play').textContent='재생'}
function draw(){if(!img)return;ctx.clearRect(0,0,448,384);ctx.drawImage(img,frame*meta.frameWidth,0,meta.frameWidth,meta.frameHeight,(448-meta.frameWidth)/2,0,meta.frameWidth,meta.frameHeight);select.value=frame;status.textContent=`${names[action]} · ${frame+1}/3 · ${meta.frames[frame].name} · ${meta.frames[frame].durationMs}ms${meta.frames[frame].hit?' · 접촉':''}${meta.frames[frame].hold?' · 마지막 자세 유지':''}`}
function advance(){draw();if(!playing)return;timer=setTimeout(()=>{if(frame===2&&!meta.loop){stop();return}frame=(frame+1)%3;advance()},meta.frames[frame].durationMs)}
async function choose(next){stop();const ticket=++request;action=next;img=null;ctx.clearRect(0,0,448,384);status.textContent='불러오는 중';try{const response=await fetch(`monster_blackroot_elder_sd_${action}_strip.json`);if(!response.ok)throw Error('manifest');const data=await response.json();const picture=new Image();picture.src=data.image;await picture.decode();if(ticket!==request)return;meta=data;img=picture;frame=0;draw();document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===action)))}catch{if(ticket===request)status.textContent='파일을 불러오지 못했습니다. 저장소의 웹 서버에서 이 검수 화면을 열어 주세요.'}}
for(const[key,label]of Object.entries(names)){const button=document.createElement('button');button.textContent=label;button.dataset.action=key;button.onclick=()=>choose(key);document.querySelector('#actions').append(button)}
document.querySelector('#play').onclick=()=>{if(playing){stop();return}if(!img)return;frame=0;playing=true;document.querySelector('#play').textContent='정지';advance()};
select.onchange=()=>{stop();frame=Number(select.value);draw()};document.querySelector('#background').onchange=e=>canvas.style.background=e.target.value;choose('idle');
</script>
</html>
