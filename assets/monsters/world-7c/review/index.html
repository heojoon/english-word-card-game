<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>7C · 고대 마도 파수병</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;background:#f7f7ff;color:#24214c;font:15px system-ui,sans-serif}main{max-width:900px;margin:auto}h1{font-size:24px}p{line-height:1.6}.arena{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:20px;background:#5751d8 url('../../../environments/world-7c/01-royal-dungeon-battle.webp') center/cover}.sprite{position:absolute;right:8%;bottom:17%;width:188.16px;height:134.4px;background-repeat:no-repeat;background-size:auto 100%;transform-origin:50% 97.5%}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{border:1px solid #ccc8f1;border-radius:12px;background:white;color:#5751d8;min-height:44px;padding:10px 15px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#5751d8;color:white}.frames{display:grid;gap:12px}.frames img{max-width:100%;height:auto;border-radius:12px;border:1px solid #dcd9ee}small{color:#74718a}@media(max-width:460px){body{padding:12px}.sprite{right:0;transform:scale(.82)}}
</style>
<main><h1>7C · 왕국 지하 던전</h1><p>일반 몬스터 <strong>고대 마도 파수병</strong> · 전투 자산 미리보기<br><small>게임 전투 연결 전 제작 검수용 페이지입니다. 공격은 마지막 프레임에서 접촉하고, 피격은 완전히 쓰러진 자세를 유지합니다.</small></p>
<div class="arena" id="arena"><div class="sprite" id="sprite" role="img" aria-label="고대 마도 파수병 대기"></div></div>
<div class="controls" id="actions"><button data-action="idle" aria-pressed="true">대기</button><button data-action="attack" aria-pressed="false">공격</button><button data-action="hit" aria-pressed="false">피격·쓰러짐</button><button id="pause" aria-pressed="false">일시정지</button></div>
<div class="controls"><button data-bg="scene">전투 배경</button><button data-bg="light">밝은 배경</button><button data-bg="violet">보라색 배경</button></div><p id="state" aria-live="polite"></p>
<div class="frames"><img src="idle-light-violet.png" alt="대기 2프레임 밝은 배경과 보라색 배경 검수"><img src="attack-light-violet.png" alt="공격 3프레임 검수"><img src="hit-light-violet.png" alt="피격 및 완전히 쓰러짐 3프레임 검수"></div></main>
<script>
const sprite=document.querySelector('#sprite'),status=document.querySelector('#state');
const definitions={idle:{names:['준비','호흡'],times:[600,600]},attack:{names:['준비','검 들어 올리기','베기 · 접촉'],times:[120,120,260]},hit:{names:['알아차림','충격','완전히 쓰러짐 · 유지'],times:[100,100,160]}};
let action='idle',elapsed=0,last=performance.now(),paused=false;
function show(next){action=next;elapsed=0;sprite.style.backgroundImage=`url('../arcane-sentry-sd-${action}-strip.png')`;sprite.setAttribute('aria-label',`고대 마도 파수병 ${next}`);document.querySelectorAll('[data-action]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.action===next)));}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>show(b.dataset.action));
document.querySelector('#pause').onclick=event=>{paused=!paused;event.target.setAttribute('aria-pressed',String(paused));event.target.textContent=paused?'계속 재생':'일시정지';};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{const arena=document.querySelector('#arena');arena.style.backgroundImage=b.dataset.bg==='scene'?'': 'none';arena.style.backgroundColor=b.dataset.bg==='light'?'#F7F7FF':'#5751D8';});
const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function tick(now){const delta=now-last;last=now;if(!paused)elapsed+=delta;const def=definitions[action],factor=reduced.matches?.5:1,total=def.times.reduce((a,b)=>a+b,0)*factor;let time=action==='idle'?elapsed%total:Math.min(elapsed,total-0.01),frame=0;while(frame<def.times.length-1&&time>=def.times[frame]*factor){time-=def.times[frame]*factor;frame++;}sprite.style.backgroundPosition=`${-188.16*frame}px 0`;status.textContent=`${paused?'정지 · ':''}${def.names[frame]} (${frame+1}/${def.names.length})`;requestAnimationFrame(tick);}
show('idle');requestAnimationFrame(tick);
</script></html>
