<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네레우스 CG · SD 애니메이션</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:16px system-ui;background:#f7f7ff;color:#24214c}main{max-width:960px;margin:auto}h1{font-size:25px}p{line-height:1.7}button{padding:10px 16px;border:1px solid #5751d8;border-radius:16px;color:#5751d8;background:white;cursor:pointer}button[aria-pressed=true]{color:white;background:#5751d8}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.card{border:1px solid #d9d6ef;border-radius:20px;padding:12px;background:white}.standing{width:100%;height:560px;object-fit:contain}.stage{background:#5751d8;border-radius:12px;position:relative;overflow:hidden;min-height:280px}.stage.light{background:#f7f7ff}.body{position:absolute;width:280px;height:200px;bottom:18px;left:50%;margin-left:-140px;background-size:300% 100%;background-repeat:no-repeat}.spear{position:absolute;width:140px;height:70px;top:80px;background-size:300% 100%;background-repeat:no-repeat}.grid{width:100%;border-radius:12px}small{display:block;color:#74718a;margin:10px 0}nav{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){body{padding:16px}.gallery{grid-template-columns:1fr}.standing{height:440px}}
</style><main><h1>흑조의 창기사 네레우스</h1><p>검은 호수의 다리를 지키며 세 갈래 창과 물안개로 침입자의 시야를 빼앗는 세이렌 기사.<br>7B 15단계 · HP 200 · 5분 · 연결문제</p><nav id="controls"></nav><div class="gallery"><section class="card"><h2>스탠딩 CG</h2><img class="standing" src="../../../novel/characters/char_nereus_world7b_standing.webp" alt="네레우스 스탠딩 CG"></section><section class="card"><h2>SD 전투 애니메이션</h2><button id="background">배경 바꾸기</button><div class="stage"><div class="body" role="img" aria-label="SD 네레우스"></div><div class="spear" aria-hidden="true"></div></div><p id="status"></p><small>아래 미리보기는 개별 자산 검수용입니다. 실제 게임 브라우저 검수와 사용자 승인은 아직 진행하지 않았습니다.</small></section></div><section class="card"><h2>프레임 · 흰색/보라색 배경 검수</h2><img class="grid" src="mobile-frame-grid.jpg" alt="대기, 투척, 고속이동, 피격과 투사체의 전체 프레임"></section></main>
<script src="../../../../nereus-boss.js"></script><script>
const boss=window.WORDORIA_NEREUS,body=document.querySelector('.body'),spear=document.querySelector('.spear'),status=document.querySelector('#status'),stage=document.querySelector('.stage');
let action='idle',started=performance.now();const names={idle:'대기',attack:'삼연창',speed:'고속이동',hit:'피격 / 쓰러짐'};
for(const [id,name] of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.dataset.id=id;b.setAttribute('aria-pressed',id===action);b.onclick=()=>{action=id;started=performance.now();document.querySelectorAll('#controls button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.id===id));};document.querySelector('#controls').append(b);}
document.querySelector('#background').onclick=()=>stage.classList.toggle('light');
function draw(now){const total=now-started,t=action==='idle'?total%1050:action==='attack'?total%2400:action==='speed'?total%12000:Math.min(total,919);let frame=0,pose=action;
if(action==='attack'){if(t>=boss.VOLLEY_MS){pose='idle';frame=0;}else{let local=Math.min(t,3*boss.THROW_INTERVAL_MS-1)%boss.THROW_INTERVAL_MS;while(frame<2&&local>=boss.ANIMATIONS.attack[frame]){local-=boss.ANIMATIONS.attack[frame];frame++;}}}
else if(action==='speed'){frame=t<120?0:t<240?1:2;body.style.opacity=t>=480&&t<10000?'0':'1';body.style.translate=t<480?`${Math.sin(t/20)*5}px 0`:'0 0';}
else{let rest=t;const durations=boss.ANIMATIONS[action];while(frame<2&&rest>=durations[frame]){rest-=durations[frame];frame++;}}
if(action!=='speed'){body.style.opacity='1';body.style.translate='0 0';}
body.style.backgroundImage=`url('../char_nereus_sd_${pose}_strip.png')`;body.style.backgroundPosition=`${frame/2*100}% 0`;
const projectiles=action==='attack'?boss.projectiles({nereusVolleyMs:Math.max(0,boss.VOLLEY_MS-t),guardianReducedMotion:false}):[];
stage.querySelectorAll('.spear-copy').forEach(n=>n.remove());spear.hidden=true;
for(const projectile of projectiles){const node=spear.cloneNode();node.classList.add('spear-copy');node.hidden=false;node.style.backgroundImage="url('../char_nereus_sd_projectile_strip.png')";node.style.backgroundPosition=`${projectile.frame/2*100}% 0`;node.style.left=`${65-projectile.progress*50}%`;stage.append(node);}
status.textContent=action==='speed'&&t<10000?`고속이동 · ${Math.ceil((10000-t)/1000)}초 · ********`:names[action];requestAnimationFrame(draw);}requestAnimationFrame(draw);
</script></html>
