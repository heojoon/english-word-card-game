name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'mobile/**'
      - 'scripts/**'
      - 'content/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'index.html'
      - 'playable-preview.html'
      - 'map-creator.html'
      - 'map-creator.css'
      - 'map-creator.js'
      - 'map-creator-entry.js'
      - 'crystal-game.js'
      - 'crystal-game.css'
      - 'native-bridge.js'
      - 'playable-preview.css'
      - 'playable-preview.js'
      - 'stages.js'
      - 'stage6.js'
      - 'stage7.js'
      - 'remote-content.js'
      - 'avatar-art.js'
      - 'assets/**'
      - '.github/workflows/android.yml'

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The retired `tools` package is still part of the action's default
          # package list, so install only the packages this project needs.
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wordoria-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
